{% extends "base.html" %}
{% block content %}<section class="max-w-3xl mx-auto px-4 py-12"><div id="profile">Loading provider...</div></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const d=await CareConnectAPI.doctors.getById({{doctor_id}});profile.innerHTML=`<h1 class="text-3xl font-black">${d.name||'Information not provided.'}</h1><p class="mt-2 text-teal-700">${d.specialty}</p><dl class="mt-8 grid sm:grid-cols-2 gap-4 text-sm"><div><dt class="font-semibold">Qualification</dt><dd>${d.qualification||'Information not provided.'}</dd></div><div><dt class="font-semibold">Experience</dt><dd>${d.experience} years</dd></div><div><dt class="font-semibold">Clinic</dt><dd>${d.clinic_name}</dd></div><div><dt class="font-semibold">Status</dt><dd>${d.clinic_status}</dd></div><div><dt class="font-semibold">Estimated wait</dt><dd>${d.estimated_wait_mins} minutes</dd></div></dl><button class="button mt-8" onclick="join()">Join Queue</button><p id="message" class="mt-3 text-sm"></p>`}catch(e){profile.textContent='Provider information is unavailable.'}}async function join(){try{const r=await CareConnectAPI.queue.join({doctor_id:{{doctor_id}}});location.href='/patient/queue'}catch(e){message.textContent=e.message;message.className='mt-3 text-sm text-rose-600'}}load();</script>{% endblock %}
