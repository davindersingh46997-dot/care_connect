{% extends "base.html" %}
{% block content %}<section class="max-w-6xl mx-auto px-4 py-12"><div class="flex flex-wrap items-end justify-between gap-4"><div><h1 class="text-3xl font-black">Find a doctor</h1><p class="mt-2 text-sm text-slate-500">Only approved providers from the Care Connect database appear here.</p></div><form id="search-form" class="flex gap-2"><input id="specialty" placeholder="Specialty" class="field"><button class="button">Search</button></form></div><div id="results" class="mt-8 grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>{% endblock %}
{% block scripts %}<script>async function load(){const box=document.getElementById('results');box.innerHTML='<p class="text-slate-500">Loading providers...</p>';try{const p=new URLSearchParams(location.search);const data=await CareConnectAPI.doctors.search({specialty:specialty.value||p.get('specialty')||''});if(!data.doctors.length){box.innerHTML='<div class="md:col-span-3 border border-dashed p-8 text-center"><h2 class="font-bold">No doctors found</h2><p class="mt-2 text-sm text-slate-500">No approved healthcare providers are currently available. Try expanding your search area or check again later.</p></div>';return}box.innerHTML=data.doctors.map(d=>`<a href="/patient/doctors/${d.id}" class="border rounded-2xl p-5 hover:border-teal-500"><h2 class="font-bold">${d.name||'Information not provided.'}</h2><p class="text-sm text-teal-700">${d.specialty}</p><p class="mt-3 text-sm text-slate-600">${d.clinic_name}<br>${d.address}</p><p class="mt-4 text-sm">${d.clinic_status} · ${d.estimated_wait_mins} min estimated wait</p></a>`).join('')}catch(err){box.innerHTML='<p class="text-rose-600">Unable to load providers.</p>'}}document.getElementById('search-form').addEventListener('submit',e=>{e.preventDefault();load()});load();</script>{% endblock %}
