{% extends "base.html" %}
{% block content %}<section class="max-w-5xl mx-auto px-4 py-12"><h1 id="title" class="text-3xl font-black">Doctor workspace</h1><div id="content" class="mt-8"></div></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const me=await CareConnectAPI.auth.me();if(me.role!=='DOCTOR')throw Error();if(me.doctor.account_status!=='APPROVED'){content.innerHTML=`<p>Your doctor account is currently ${me.doctor.account_status.toLowerCase()}.</p>`;return}title.textContent=`Good afternoon, ${me.name}`;const q=await CareConnectAPI.queue.getDoctorQueue(me.doctor.id);content.innerHTML=`<div class="border rounded-2xl p-6"><p>Clinic status: <strong>${q.doctor.clinic_status}</strong></p><p class="mt-2">Today's patients: ${q.overview.total_today}</p><p class="mt-2">Currently waiting: ${q.overview.waiting_count}</p><button class="button mt-6" onclick="nextPatient()">Call Next</button></div>`}catch(e){location.href='/login?redirect=/doctor/dashboard'}}async function nextPatient(){await CareConnectAPI.queue.callNext();load()}load();</script>{% endblock %}
