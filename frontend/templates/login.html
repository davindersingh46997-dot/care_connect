{% extends "base.html" %}
{% block content %}<section class="max-w-md mx-auto px-4 py-16"><h1 class="text-3xl font-black">Log in</h1><p class="mt-2 text-sm text-slate-500">Access your Care Connect account.</p><form id="login-form" class="mt-8 space-y-4"><input id="email" type="email" required placeholder="Email" class="field"><input id="password" type="password" required placeholder="Password" class="field"><p id="error" class="hidden text-sm text-rose-600"></p><button class="button w-full">Log In</button></form><p class="mt-6 text-sm text-slate-500">New here? <a class="text-teal-700 font-semibold" href="/signup">Create a patient account</a></p></section>{% endblock %}
{% block scripts %}<script>document.getElementById('login-form').addEventListener('submit',async(e)=>{e.preventDefault();const error=document.getElementById('error');error.classList.add('hidden');try{const data=await CareConnectAPI.auth.login({email:email.value,password:password.value});CareConnectAPI.setToken(data.access_token);const redirect=new URLSearchParams(location.search).get('redirect');const role=data.user.role;location.href=redirect||({PATIENT:'/patient/dashboard',DOCTOR:'/doctor/dashboard'}[role]||'/');}catch(err){error.textContent='Invalid email or password.';error.classList.remove('hidden');}});</script>{% endblock %}
