{% extends "base.html" %}
{% block content %}<section class="max-w-6xl mx-auto px-4 py-12"><h1 class="text-3xl font-black">Doctor applications</h1><div id="list" class="mt-8 space-y-3"></div></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const me=await CareConnectAPI.auth.me();if(me.role!=='ADMIN')throw Error();const doctors=await CareConnectAPI.admin.getAllDoctors();list.innerHTML=doctors.length?doctors.map(d=>`<div class="border rounded-2xl p-5 flex flex-wrap justify-between gap-4"><div><h2 class="font-bold">${d.name}</h2><p class="text-sm text-slate-500">${d.specialty} · ${d.account_status}</p></div>${d.account_status==='PENDING'?`<button class="button" onclick="approve(${d.id})">Approve</button>`:''}</div>`).join(''):'<p>No doctor applications yet.</p>'}catch(e){location.href='/login?redirect=/admin/dashboard'}}async function approve(id){await CareConnectAPI.admin.approveDoctor(id);load()}load();</script>{% endblock %}
