{% extends "base.html" %}
{% block content %}<section class="max-w-2xl mx-auto px-4 py-12"><h1 class="text-3xl font-black">Your queue</h1><div id="queue" class="mt-8 border rounded-2xl p-6"></div></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const q=await CareConnectAPI.queue.getPatientQueue();queue.innerHTML=q.has_active_queue?`<p class="text-sm text-slate-500">${q.active_queue.doctor.name||'Information not provided.'}</p><div class="my-6 text-6xl font-black text-teal-700">#${q.active_queue.token_number}</div><p>Current token #${q.active_queue.current_token}</p><p class="mt-2">${q.active_queue.patients_ahead} patients ahead</p><p class="mt-2">Estimated wait: ${q.active_queue.estimated_wait_mins} minutes</p><p class="mt-4 font-bold">Status: ${q.active_queue.status}</p><button class="button mt-6" onclick="leave()">Leave queue</button>`:'<p>You do not have an active queue.</p>'}catch(e){location.href='/login?redirect=/patient/queue'}}async function leave(){await CareConnectAPI.queue.leave();load()}load();</script>{% endblock %}
