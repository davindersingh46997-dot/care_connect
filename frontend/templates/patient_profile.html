{% extends "base.html" %}
{% block content %}<section class="max-w-xl mx-auto px-4 py-12"><h1 class="text-3xl font-black">Your profile</h1><form id="profile" class="mt-8 space-y-4"><input id="name" required class="field" placeholder="Full name"><input id="age" type="number" min="0" max="130" class="field" placeholder="Age"><input id="phone" class="field" placeholder="Phone"><input id="location" class="field" placeholder="Location"><button class="button">Save changes</button><p id="message" class="text-sm"></p></form></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const p=await CareConnectAPI.patients.getProfile();if(p.role!=='PATIENT')throw Error();name.value=p.name||'';age.value=p.age||'';phone.value=p.phone||'';location.value=p.location||''}catch(e){location.href='/login?redirect=/patient/profile'}}document.getElementById('profile').addEventListener('submit',async(e)=>{e.preventDefault();try{await CareConnectAPI.patients.updateProfile({name:name.value,age:age.value?Number(age.value):null,phone:phone.value,location:location.value});message.textContent='Profile updated.';message.className='text-sm text-emerald-700'}catch(err){message.textContent=err.message;message.className='text-sm text-rose-600'}});load();</script>{% endblock %}
