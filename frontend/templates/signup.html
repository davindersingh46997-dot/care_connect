{% extends "base.html" %}
{% block content %}<section class="max-w-md mx-auto px-4 py-16"><h1 class="text-3xl font-black">Create your account</h1><p class="mt-2 text-sm text-slate-500">Patient registration is free.</p><form id="signup-form" class="mt-8 space-y-4"><input id="name" required placeholder="Full name" class="field"><input id="email" type="email" required placeholder="Email" class="field"><input id="password" type="password" minlength="8" required placeholder="Password" class="field"><input id="confirm" type="password" required placeholder="Confirm password" class="field"><input id="age" type="number" min="0" max="130" placeholder="Age (optional)" class="field"><input id="location" placeholder="Location (optional)" class="field"><p id="error" class="hidden text-sm text-rose-600"></p><button class="button w-full">Create account</button></form></section>{% endblock %}
{% block scripts %}<script>document.getElementById('signup-form').addEventListener('submit',async(e)=>{e.preventDefault();const error=document.getElementById('error');if(password.value!==confirm.value){error.textContent='Passwords do not match.';error.classList.remove('hidden');return}try{const data=await CareConnectAPI.auth.register({name:name.value,email:email.value,password:password.value,age:age.value?Number(age.value):null,location:location.value||null});CareConnectAPI.setToken(data.access_token);location.href='/patient/dashboard';}catch(err){error.textContent=err.message;error.classList.remove('hidden');}});</script>{% endblock %}
