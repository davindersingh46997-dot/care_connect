{% extends "base.html" %}
{% block content %}<section class="max-w-5xl mx-auto px-4 py-12"><h1 id="greeting" class="text-3xl font-black">Your dashboard</h1><p class="mt-2 text-slate-500">How can we help you today?</p><a href="/patient/doctors" class="button inline-block mt-6">Find a Doctor</a><div id="queue" class="mt-10 border rounded-2xl p-6"></div></section>{% endblock %}
{% block scripts %}<script>async function load(){try{const me=await CareConnectAPI.auth.me();if(me.role!=='PATIENT')throw Error();greeting.textContent=`Good afternoon, ${me.name}.`;const q=await CareConnectAPI.queue.getPatientQueue();queue.innerHTML=q.has_active_queue?`<h2 class="font-bold">Your Current Visit</h2><p class="mt-3">Token #${q.active_queue.token_number} · Current #${q.active_queue.current_token}</p><p class="mt-2 text-sm">${q.active_queue.patients_ahead} patients ahead · ${q.active_queue.estimated_wait_mins} minutes estimated wait</p><a class="text-teal-700 text-sm font-semibold" href="/patient/queue">View Queue</a>`:'<h2 class="font-bold">You do not have an active queue.</h2><p class="mt-2 text-sm text-slate-500">Find a healthcare provider when you need one.</p>'}catch(e){location.href='/login?redirect=/patient/dashboard'}}load();</script>{% endblock %}
